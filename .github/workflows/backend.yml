name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run SQLite and HTTP integration tests
        working-directory: server
        run: npm test
      - name: Run simulated two-phone local smoke test
        working-directory: server
        run: npm run test:devices
